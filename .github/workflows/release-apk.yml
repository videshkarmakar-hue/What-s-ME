name: Auto Release APK

# Release agent: every code change pushed to main produces a fresh, clean,
# standalone release APK and publishes it as a GitHub Release asset.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(grep -m1 -oE 'versionName "[0-9]+\.[0-9]+\.[0-9]+' android/app/build.gradle | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          [ -z "$current" ] && current="1.0.0"

          # The local APK-export watcher bumps and commits the version first.
          # Reuse it so the release tag matches the APK it just built.
          if [[ "${COMMIT_MESSAGE}" == *"[apk-export]"* ]]; then
            echo "mode=export" >> "$GITHUB_OUTPUT"
            echo "version=${current}" >> "$GITHUB_OUTPUT"
            echo "APK export detected, using version ${current}"
            exit 0
          fi

          echo "mode=auto" >> "$GITHUB_OUTPUT"
          tags="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name' 2>/dev/null || true)"
          published="$(printf '%s\n' "$tags" | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          base="$(printf '%s\n%s\n' "$current" "$published" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          IFS='.' read -r major minor patch <<< "$base"
          next="${major}.${minor}.$((patch + 1))"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${next}"

      - name: Bump version everywhere
        if: steps.version.outputs.mode == 'auto'
        run: node scripts/bump-version.mjs "${{ steps.version.outputs.version }}"

      - name: Build clean standalone release APK
        working-directory: android
        run: bash ./gradlew clean assembleRelease -PreleaseUniversalApk=true

      - name: Prepare release asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-universal-release.apk \
            "release/What-s-ME-v${VERSION}-release.apk"
          ls -lh release

      - name: Verify APK version matches release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APK="$PWD/release/What-s-ME-v${VERSION}-release.apk"
          APK_VERSION="$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          echo "Release tag: ${VERSION}, APK versionName: ${APK_VERSION}"
          if [ "$APK_VERSION" != "$VERSION" ]; then
            echo "Version mismatch - refusing to publish" >&2
            exit 1
          fi

      - name: Commit version bump (skip CI)
        if: steps.version.outputs.mode == 'auto'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle package.json package-lock.json \
            src/context/LanguageContext.tsx src/screens/AboutScreen.tsx \
            src/services/appUpdate.ts fdroid/com.videshkarmakar.whatsapp.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to v${VERSION} [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          asset="release/What-s-ME-v${VERSION}-release.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "What-s-ME ${tag}" \
              --notes "Fresh standalone release APK built from ${GITHUB_SHA}. Bundled JS, minified. Open the app to install this update directly - no GitHub visit needed." \
              --target "${GITHUB_SHA}"
          fi
